<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Numinhos — Tests</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 20px auto; padding: 0 16px; color: #2d1f3d; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin: 20px 0 6px; color: #6b46c1; }
  ul { list-style: none; padding-left: 8px; }
  li { padding: 3px 0; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  li.ok { color: #2aa85b; }
  li.fail { color: #c92a2a; }
  pre { background: #fdf2f2; padding: 8px 12px; border-radius: 6px; margin-top: 4px; font-size: 12px; white-space: pre-wrap; }
  .summary { padding: 12px 16px; border-radius: 10px; font-weight: 700; margin-bottom: 12px; }
  .summary.ok { background: #e0f6e8; color: #2aa85b; }
  .summary.fail { background: #fde2e2; color: #c92a2a; }
</style>
</head>
<body>
<h1>Numinhos — Test Runner</h1>
<p style="font-size: 13px; opacity: 0.6;">Rodando testes unitários direto no browser. <a href="/">← voltar ao jogo</a></p>
<div id="out">Carregando testes…</div>
<script type="module" src="run.js"></script>
</body>
</html>
