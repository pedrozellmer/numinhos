<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe8d6">
<title>Numinhos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Fredoka', sans-serif;
    color: #2d1f3d;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    background: linear-gradient(180deg, #ffe8d6 0%, #ffd6e8 50%, #d6e8ff 100%);
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    position: relative;
    min-height: 100vh;
  }

  /* ============ HUD ============ */
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 6px;
    z-index: 10;
  }
  .hud-group { display: flex; align-items: center; gap: 10px; }
  .pill {
    background: white;
    border-radius: 999px;
    padding: 6px 12px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    display: flex; align-items: center; gap: 5px;
  }
  .pill.lives { color: #e63946; }
  .pill.score { color: #6b46c1; }
  .pill.level { color: #2a9d8f; }
  .back-btn {
    background: white; border: none;
    width: 36px; height: 36px; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .back-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }

  /* ============ ARENA ============ */
  #wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 12px;
  }
  canvas {
    display: block;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,0.7),
      0 8px 24px rgba(45, 31, 61, 0.1);
  }

  /* ============ HAND ============ */
  .hand {
    padding: 10px 14px 16px;
    display: flex;
    gap: 8px;
    justify-content: center;
    min-height: 100px;
  }
  .card {
    width: 64px; height: 80px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    cursor: grab;
    position: relative;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .card.add { border-color: #43d177; color: #1f7a45; background: linear-gradient(180deg, #fff, #e8fff0); }
  .card.sub { border-color: #ff6b6b; color: #c92a2a; background: linear-gradient(180deg, #fff, #ffe8e8); }
  .card.mul { border-color: #ffd166; color: #b58200; background: linear-gradient(180deg, #fff, #fff7d6); }
  .card.div { border-color: #6c8dff; color: #2d4dc7; background: linear-gradient(180deg, #fff, #e8eeff); }
  .card.dragging { opacity: 0.3; }
  .card-op { font-size: 24px; line-height: 1; }
  .card-val { font-size: 20px; line-height: 1.1; }

  /* ============ DRAG PREVIEW ============ */
  #dragPreview {
    position: fixed;
    width: 64px; height: 80px;
    pointer-events: none;
    z-index: 1000;
    display: none;
    transform: translate(-50%, -50%) scale(1.1) rotate(-5deg);
    filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
  }

  /* ============ SCREENS ============ */
  .screen {
    position: fixed; inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .screen.show { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

  .screen.menu {
    background: linear-gradient(180deg, #ffe8d6 0%, #ffd6e8 50%, #d6e8ff 100%);
    overflow-y: auto;
    padding-top: 30px;
  }

  .splash-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 56px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ffd166 50%, #6c8dff 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 2px;
    letter-spacing: -1px;
    animation: bounce 2.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .splash-sub {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 20px;
    font-weight: 500;
  }
  .splash-mascots {
    display: flex; gap: 14px;
    margin-bottom: 28px;
  }
  .mascot {
    font-size: 44px;
    animation: float 3s ease-in-out infinite;
  }
  .mascot:nth-child(2) { animation-delay: 0.3s; }
  .mascot:nth-child(3) { animation-delay: 0.6s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
  }

  .level-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 24px;
  }
  .level-btn {
    aspect-ratio: 1;
    border: none;
    background: white;
    border-radius: 18px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.1);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #2d1f3d;
    transition: transform 0.1s;
    position: relative;
  }
  .level-btn:active:not(.locked) {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.1);
  }
  .level-btn.locked {
    color: #c8c8c8;
    background: #f0f0f0;
    cursor: not-allowed;
    box-shadow: 0 3px 0 rgba(0,0,0,0.05);
  }
  .level-btn.completed {
    background: linear-gradient(180deg, #fff, #fff8e1);
  }
  .level-btn .stars {
    font-size: 12px;
    margin-top: 2px;
    letter-spacing: 1px;
  }
  .level-btn .difficulty-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    font-size: 14px;
  }

  .legend {
    background: rgba(255,255,255,0.6);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 11px;
    text-align: center;
    line-height: 1.6;
    max-width: 320px;
  }
  .legend-row { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 8px; }

  /* ============ MODAL ============ */
  .modal-overlay {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modal-card {
    background: white;
    border-radius: 28px;
    padding: 30px 26px;
    width: 88%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal-emoji {
    font-size: 60px;
    margin-bottom: 4px;
    animation: wiggle 0.6s ease-in-out;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }
  .modal-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 26px;
    margin-bottom: 4px;
  }
  .modal-sub { font-size: 13px; opacity: 0.6; margin-bottom: 18px; }
  .stars-result {
    font-size: 32px;
    letter-spacing: 6px;
    margin-bottom: 14px;
    height: 40px;
  }
  .star-empty { opacity: 0.2; }
  .modal-stats {
    background: #f7f3fa;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-around;
  }
  .stat-block .v {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: #6b46c1;
  }
  .stat-block .l {
    font-size: 10px;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal-actions { display: flex; flex-direction: column; gap: 8px; }

  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 999px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    color: white;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .btn-primary { background: linear-gradient(180deg, #ff8e3c, #ff6b6b); }
  .btn-secondary { background: linear-gradient(180deg, #6c8dff, #4d6dff); }
  .btn-ad { background: linear-gradient(180deg, #43d177, #2aa85b); }
  .btn-ad::before { content: '▶ '; }

  /* ============ FLASH ============ */
  .flash-msg {
    position: fixed;
    top: 30%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 38px;
    pointer-events: none;
    opacity: 0;
    z-index: 200;
    text-align: center;
    color: #ff6b6b;
    text-shadow: 2px 2px 0 white, -1px -1px 0 white, 1px -1px 0 white, -1px 1px 0 white;
  }
  .flash-msg.show {
    animation: flashShow 1s ease-out;
  }
  @keyframes flashShow {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5) rotate(-10deg); }
    25% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(2deg); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(0.9); }
  }

  /* ============ TUTORIAL ============ */
  .tutorial {
    position: fixed;
    background: white;
    padding: 12px 18px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    z-index: 50;
    max-width: 240px;
    text-align: center;
    pointer-events: none;
    animation: tutPop 0.3s;
  }
  @keyframes tutPop {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

  <!-- HUD do jogo -->
  <div class="hud" id="gameHud" style="display:none">
    <div class="hud-group">
      <button class="back-btn" id="backBtn">←</button>
      <div class="pill level"><span>🗺️</span><span id="levelLabel">1</span></div>
    </div>
    <div class="hud-group">
      <div class="pill lives"><span>❤️</span><span id="livesLabel">3</span></div>
      <div class="pill score"><span>⭐</span><span id="scoreLabel">0</span></div>
    </div>
  </div>

  <!-- Arena -->
  <div id="wrap" style="display:none">
    <canvas id="game"></canvas>
  </div>

  <!-- Mão -->
  <div class="hand" id="hand" style="display:none"></div>

  <!-- Drag preview -->
  <div id="dragPreview"></div>

  <!-- Tela Menu / Mapa -->
  <div class="screen menu show" id="menuScreen">
    <div class="splash-title">Numinhos</div>
    <div class="splash-sub">defenda-se com matemática 🎯</div>
    <div class="splash-mascots">
      <div class="mascot">🦄</div>
      <div class="mascot">🐸</div>
      <div class="mascot">🐙</div>
    </div>
    <div class="legend">
      <div style="font-weight: 700; margin-bottom: 6px;">Dificuldade do bloco</div>
      <div class="legend-row">
        <span>🟢 Fácil</span>
        <span>🟡 Médio</span>
        <span>🟠 Difícil</span>
        <span>🔴 Extremo</span>
      </div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div style="font-size: 11px; opacity: 0.5; margin-bottom: 20px;">protótipo · 8 fases · v0.2</div>
  </div>

  <!-- Tela vitória -->
  <div class="screen modal-overlay" id="winScreen">
    <div class="modal-card">
      <div class="modal-emoji">🎉</div>
      <div class="modal-title">Fase Vencida!</div>
      <div class="modal-sub" id="winSub">Você defendeu o reino</div>
      <div class="stars-result" id="winStars">⭐⭐⭐</div>
      <div class="modal-stats">
        <div class="stat-block">
          <div class="v" id="winScore">0</div>
          <div class="l">Pontos</div>
        </div>
        <div class="stat-block">
          <div class="v" id="winLives">3</div>
          <div class="l">Vidas</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ad" id="winDoubleBtn">Dobrar pontos (ad)</button>
        <button class="btn btn-primary" id="winNextBtn">Próxima fase</button>
        <button class="btn btn-secondary" id="winMenuBtn">Mapa</button>
      </div>
    </div>
  </div>

  <!-- Tela derrota -->
  <div class="screen modal-overlay" id="loseScreen">
    <div class="modal-card">
      <div class="modal-emoji">😢</div>
      <div class="modal-title">Quase!</div>
      <div class="modal-sub">Tente novamente, você consegue</div>
      <div class="modal-actions">
        <button class="btn btn-ad" id="loseReviveBtn">Continuar com 2 vidas (ad)</button>
        <button class="btn btn-primary" id="loseRetryBtn">Tentar de novo</button>
        <button class="btn btn-secondary" id="loseMenuBtn">Mapa</button>
      </div>
    </div>
  </div>

  <div class="flash-msg" id="flashMsg"></div>

<script>
(() => {
  // ============ FASES (8 fases pra protótipo) ============
  // Curva: 4 fáceis -> 3 médias -> 1 difícil
  // diff: 0=fácil verde, 1=médio amarelo, 2=difícil laranja, 3=extremo vermelho
  // ops: operações disponíveis
  // enemies: lista de inimigos {value, delay (s), speed (rows/s)}
  // hand: cartas iniciais e refill
  const LEVELS = [
    {
      id: 1, diff: 0, lives: 3,
      title: 'Primeiros passos', goal: '3 inimigos',
      ops: ['+', '-'],
      handPool: [{op:'-', val:1}, {op:'-', val:2}, {op:'-', val:3}, {op:'-', val:4}, {op:'-', val:5}],
      enemies: [
        {value: 3, delay: 1.5, speed: 0.16},
        {value: 5, delay: 6.0, speed: 0.16},
        {value: 4, delay: 11.0, speed: 0.16},
      ],
      tutorial: 'Arraste uma carta vermelha (-) no inimigo até zerar o número!',
    },
    {
      id: 2, diff: 0, lives: 3,
      title: 'Combinando', goal: '4 inimigos',
      ops: ['+', '-'],
      handPool: [{op:'-', val:1}, {op:'-', val:2}, {op:'-', val:3}, {op:'-', val:5}, {op:'+', val:1}],
      enemies: [
        {value: 4, delay: 1.0, speed: 0.18},
        {value: 6, delay: 4.5, speed: 0.18},
        {value: 7, delay: 8.5, speed: 0.18},
        {value: 5, delay: 12.5, speed: 0.18},
      ],
      tutorial: 'Cartas verdes (+) somam — use quando precisar ajustar o resultado!',
    },
    {
      id: 3, diff: 0, lives: 3,
      title: 'Mais inimigos', goal: '5 inimigos',
      ops: ['+', '-'],
      handPool: [{op:'-', val:2}, {op:'-', val:3}, {op:'-', val:5}, {op:'+', val:1}, {op:'+', val:2}],
      enemies: [
        {value: 5, delay: 1.0, speed: 0.20},
        {value: 7, delay: 4.0, speed: 0.20},
        {value: 6, delay: 7.0, speed: 0.20},
        {value: 8, delay: 10.0, speed: 0.20},
        {value: 4, delay: 13.5, speed: 0.20},
      ],
    },
    {
      id: 4, diff: 0, lives: 3,
      title: 'Acelerando', goal: '5 inimigos',
      ops: ['+', '-'],
      handPool: [{op:'-', val:3}, {op:'-', val:5}, {op:'-', val:7}, {op:'+', val:2}, {op:'+', val:3}],
      enemies: [
        {value: 6, delay: 0.8, speed: 0.22},
        {value: 9, delay: 3.5, speed: 0.22},
        {value: 7, delay: 6.5, speed: 0.24},
        {value: 10, delay: 9.0, speed: 0.22},
        {value: 8, delay: 12.0, speed: 0.24},
      ],
    },
    {
      id: 5, diff: 1, lives: 3,
      title: 'Onda', goal: '6 inimigos',
      ops: ['+', '-'],
      handPool: [{op:'-', val:3}, {op:'-', val:5}, {op:'-', val:8}, {op:'+', val:1}, {op:'+', val:3}],
      enemies: [
        {value: 7, delay: 0.8, speed: 0.24},
        {value: 9, delay: 3.0, speed: 0.24},
        {value: 5, delay: 5.5, speed: 0.26},
        {value: 12, delay: 7.5, speed: 0.24},
        {value: 8, delay: 10.0, speed: 0.26},
        {value: 10, delay: 12.5, speed: 0.26},
      ],
    },
    {
      id: 6, diff: 1, lives: 3,
      title: 'Multiplicação', goal: '6 inimigos',
      ops: ['+', '-', '×'],
      handPool: [{op:'-', val:4}, {op:'-', val:6}, {op:'+', val:2}, {op:'×', val:2}, {op:'×', val:0}],
      enemies: [
        {value: 6, delay: 1.0, speed: 0.24},
        {value: 8, delay: 3.5, speed: 0.24},
        {value: 4, delay: 6.0, speed: 0.26},
        {value: 14, delay: 8.5, speed: 0.24},
        {value: 9, delay: 11.0, speed: 0.26},
        {value: 11, delay: 13.5, speed: 0.26},
      ],
      tutorial: 'Cartas amarelas MULTIPLICAM. ×0 zera direto, ×2 dobra (cuidado!)',
    },
    {
      id: 7, diff: 1, lives: 3,
      title: 'Combinações', goal: '7 inimigos',
      ops: ['+', '-', '×'],
      handPool: [{op:'-', val:5}, {op:'-', val:8}, {op:'+', val:3}, {op:'×', val:2}, {op:'×', val:0}],
      enemies: [
        {value: 7, delay: 0.8, speed: 0.26},
        {value: 13, delay: 3.0, speed: 0.26},
        {value: 8, delay: 5.5, speed: 0.28},
        {value: 16, delay: 7.5, speed: 0.26},
        {value: 9, delay: 10.0, speed: 0.28},
        {value: 11, delay: 12.5, speed: 0.28},
        {value: 14, delay: 15.0, speed: 0.28},
      ],
    },
    {
      id: 8, diff: 2, lives: 2,
      title: 'Desafio', goal: '8 inimigos · 2 vidas',
      ops: ['+', '-', '×'],
      handPool: [{op:'-', val:7}, {op:'-', val:4}, {op:'+', val:3}, {op:'×', val:2}, {op:'×', val:0}],
      enemies: [
        {value: 8, delay: 0.8, speed: 0.28},
        {value: 11, delay: 2.8, speed: 0.28},
        {value: 6, delay: 4.8, speed: 0.32},
        {value: 18, delay: 6.5, speed: 0.28},
        {value: 13, delay: 8.5, speed: 0.30},
        {value: 9, delay: 10.5, speed: 0.32},
        {value: 21, delay: 12.5, speed: 0.28},
        {value: 15, delay: 14.5, speed: 0.30},
      ],
    },
  ];

  // ============ MASCOTES ============
  // Cor dos numinhos varia por valor
  const MASCOTS = ['🐸','🦊','🐙','🐰','🐻','🦄','🐳','🦁','🐯','🐨','🐵','🦝'];
  function mascotFor(v) {
    return MASCOTS[Math.abs(v) % MASCOTS.length];
  }
  function colorFor(v) {
    if (v === 0) return '#cccccc';
    if (v < 0) return '#9d4edd';
    if (v <= 5) return '#43d177';
    if (v <= 10) return '#ffd166';
    if (v <= 20) return '#ff8e3c';
    return '#ff6b6b';
  }

  // ============ STATE ============
  const state = {
    progress: loadProgress(),
    currentLevel: null,
    enemies: [],
    cards: [],
    cardSlots: 4,
    score: 0,
    lives: 3,
    lossOfLevel: false,
    enemiesSpawned: 0,
    enemiesKilled: 0,
    levelStartTime: 0,
    gameRunning: false,
    particles: [],
    floatingTexts: [],
    shake: 0,
    dragging: null, // { card, x, y }
    nextCardId: 1,
    nextEnemyId: 1,
  };

  function loadProgress() {
    try {
      return JSON.parse(localStorage.getItem('numinhos_progress') || '{}');
    } catch { return {}; }
  }
  function saveProgress() {
    localStorage.setItem('numinhos_progress', JSON.stringify(state.progress));
  }

  // ============ CANVAS ============
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const wrap = document.getElementById('wrap');
    const wrapW = wrap.clientWidth - 24;
    const wrapH = wrap.clientHeight;
    W = Math.min(wrapW, 420);
    H = wrapH;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', () => { if (state.gameRunning) resize(); });

  // ============ MENU / MAPA ============
  function renderMenu() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    LEVELS.forEach((lvl, i) => {
      const btn = document.createElement('button');
      const prevId = i === 0 ? null : LEVELS[i-1].id;
      const isUnlocked = i === 0 || (state.progress[prevId] && state.progress[prevId].stars > 0);
      const completed = state.progress[lvl.id];
      btn.className = 'level-btn' + (isUnlocked ? '' : ' locked') + (completed ? ' completed' : '');
      const diffEmojis = ['🟢','🟡','🟠','🔴'];
      if (isUnlocked) {
        btn.innerHTML = `
          <span class="difficulty-badge">${diffEmojis[lvl.diff]}</span>
          <div>${lvl.id}</div>
          <div class="stars">${renderStarsHtml(completed ? completed.stars : 0)}</div>
        `;
        btn.onclick = () => startLevel(lvl);
      } else {
        btn.innerHTML = `<span class="lock-icon">🔒</span>`;
      }
      grid.appendChild(btn);
    });
  }
  function renderStarsHtml(n) {
    return [1,2,3].map(i => i <= n ? '⭐' : '<span style="opacity:0.2">⭐</span>').join('');
  }

  // ============ LEVEL START ============
  function startLevel(lvl) {
    state.currentLevel = lvl;
    state.enemies = [];
    state.cards = [];
    state.score = 0;
    state.lives = lvl.lives;
    state.enemiesSpawned = 0;
    state.enemiesKilled = 0;
    state.particles = [];
    state.floatingTexts = [];
    state.shake = 0;
    state.dragging = null;
    state.gameRunning = true;
    state.levelStartTime = performance.now();
    state.lossOfLevel = false;

    // Esconder telas
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));

    // Mostrar HUD/arena/mão
    document.getElementById('gameHud').style.display = 'flex';
    document.getElementById('wrap').style.display = 'flex';
    document.getElementById('hand').style.display = 'flex';

    document.getElementById('levelLabel').textContent = lvl.id;
    updateHUD();
    resize();

    // Mão inicial
    refillHand(true);

    // Tutorial
    if (lvl.tutorial) showTutorial(lvl.tutorial);
  }

  function updateHUD() {
    document.getElementById('livesLabel').textContent = state.lives;
    document.getElementById('scoreLabel').textContent = state.score;
  }

  function showTutorial(text) {
    const el = document.createElement('div');
    el.className = 'tutorial';
    el.textContent = text;
    el.style.top = '50%';
    el.style.left = '50%';
    el.style.transform = 'translate(-50%, -50%)';
    document.body.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity 0.4s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 400);
    }, 3500);
  }

  // ============ HAND ============
  function refillHand(initial = false) {
    const lvl = state.currentLevel;
    const handDiv = document.getElementById('hand');
    if (initial) handDiv.innerHTML = '';
    while (state.cards.length < state.cardSlots) {
      const proto = lvl.handPool[Math.floor(Math.random() * lvl.handPool.length)];
      const card = { id: state.nextCardId++, op: proto.op, val: proto.val };
      state.cards.push(card);
      addCardToDOM(card);
    }
  }

  function addCardToDOM(card) {
    const el = document.createElement('div');
    el.className = 'card ' + cardClass(card.op);
    el.dataset.id = card.id;
    el.innerHTML = `<div class="card-op">${card.op}</div><div class="card-val">${card.val}</div>`;
    bindCardDrag(el, card);
    document.getElementById('hand').appendChild(el);
    // Animação de entrada
    el.style.transform = 'scale(0.5) translateY(20px)';
    el.style.opacity = '0';
    requestAnimationFrame(() => {
      el.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s';
      el.style.transform = 'scale(1) translateY(0)';
      el.style.opacity = '1';
      setTimeout(() => { el.style.transition = 'transform 0.1s'; }, 300);
    });
  }

  function cardClass(op) {
    return op === '+' ? 'add' : op === '-' ? 'sub' : op === '×' ? 'mul' : 'div';
  }

  function removeCard(card) {
    state.cards = state.cards.filter(c => c.id !== card.id);
    const el = document.querySelector(`.card[data-id="${card.id}"]`);
    if (el) el.remove();
  }

  // ============ DRAG ============
  function bindCardDrag(el, card) {
    let startX = 0, startY = 0;
    let active = false;

    const onStart = (clientX, clientY) => {
      if (!state.gameRunning) return;
      active = true;
      startX = clientX;
      startY = clientY;
      el.classList.add('dragging');
      const preview = document.getElementById('dragPreview');
      preview.innerHTML = el.innerHTML;
      preview.className = '';
      preview.style.background = getComputedStyle(el).background;
      preview.style.borderRadius = '14px';
      preview.style.border = `2px solid ${getComputedStyle(el).borderTopColor}`;
      preview.style.color = getComputedStyle(el).color;
      preview.style.fontFamily = "'Baloo 2', sans-serif";
      preview.style.fontWeight = '800';
      preview.style.display = 'flex';
      preview.style.flexDirection = 'column';
      preview.style.alignItems = 'center';
      preview.style.justifyContent = 'center';
      preview.style.left = clientX + 'px';
      preview.style.top = clientY + 'px';
      // Inner sizing
      const op = preview.querySelector('.card-op');
      const val = preview.querySelector('.card-val');
      if (op) op.style.fontSize = '24px';
      if (val) val.style.fontSize = '20px';
      state.dragging = { card, x: clientX, y: clientY };
    };
    const onMove = (clientX, clientY) => {
      if (!active) return;
      const preview = document.getElementById('dragPreview');
      preview.style.left = clientX + 'px';
      preview.style.top = clientY + 'px';
      state.dragging.x = clientX;
      state.dragging.y = clientY;
    };
    const onEnd = (clientX, clientY) => {
      if (!active) return;
      active = false;
      el.classList.remove('dragging');
      document.getElementById('dragPreview').style.display = 'none';
      state.dragging = null;
      // Detectar inimigo no ponto
      tryApplyCard(card, clientX, clientY);
    };

    // Touch
    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      onStart(t.clientX, t.clientY);
    }, { passive: false });

    document.addEventListener('touchmove', (e) => {
      if (!active) return;
      e.preventDefault();
      const t = e.touches[0];
      onMove(t.clientX, t.clientY);
    }, { passive: false });

    document.addEventListener('touchend', (e) => {
      if (!active) return;
      e.preventDefault();
      const t = e.changedTouches[0];
      onEnd(t.clientX, t.clientY);
    }, { passive: false });

    // Mouse fallback
    el.addEventListener('mousedown', (e) => {
      onStart(e.clientX, e.clientY);
    });
    document.addEventListener('mousemove', (e) => {
      if (active) onMove(e.clientX, e.clientY);
    });
    document.addEventListener('mouseup', (e) => {
      if (active) onEnd(e.clientX, e.clientY);
    });
  }

  function tryApplyCard(card, clientX, clientY) {
    // Achar inimigo no canvas
    const rect = canvas.getBoundingClientRect();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    if (cx < 0 || cx > W || cy < 0 || cy > H) return; // fora da arena
    let target = null;
    let bestDist = 50; // raio de detecção
    for (const e of state.enemies) {
      if (e.dying) continue;
      const dx = e.x - cx, dy = e.y - cy;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d < bestDist) { bestDist = d; target = e; }
    }
    if (target) {
      applyOp(card, target);
      removeCard(card);
      refillHand();
    }
  }

  function applyOp(card, enemy) {
    const before = enemy.value;
    let v = enemy.value;
    if (card.op === '+') v = v + card.val;
    else if (card.op === '-') v = v - card.val;
    else if (card.op === '×') v = v * card.val;
    else if (card.op === '÷') v = card.val === 0 ? v : Math.round(v / card.val);
    enemy.value = v;
    enemy.flashTime = 0.4;
    // Texto flutuante
    state.floatingTexts.push({
      x: enemy.x, y: enemy.y - 20,
      vy: -1.5,
      life: 1,
      text: (card.op === '×' ? '×' + card.val : (card.op === '+' ? '+' + card.val : (card.op === '-' ? '-' + card.val : '÷' + card.val))),
      color: card.op === '+' ? '#43d177' : card.op === '-' ? '#ff6b6b' : card.op === '×' ? '#ffa600' : '#6c8dff',
    });
    // Vibração leve
    if (navigator.vibrate) navigator.vibrate(20);

    if (v === 0) {
      // Inimigo morto!
      destroyEnemy(enemy);
    } else if (v < 0) {
      // Tornou-se negativo: piora? Pra simplicidade, só fica negativo - precisa subir até 0
      // Mantém vivo mas com cor diferente
    }
  }

  function destroyEnemy(enemy) {
    enemy.dying = true;
    state.enemiesKilled++;
    state.score += 100 + Math.floor(state.lives * 25);
    updateHUD();
    spawnConfetti(enemy.x, enemy.y);
    state.shake = Math.min(state.shake + 8, 16);
    if (navigator.vibrate) navigator.vibrate(40);
  }

  // ============ ENEMY SPAWN ============
  function maybeSpawnEnemies(elapsed) {
    const lvl = state.currentLevel;
    while (state.enemiesSpawned < lvl.enemies.length) {
      const next = lvl.enemies[state.enemiesSpawned];
      if (elapsed >= next.delay) {
        spawnEnemy(next);
        state.enemiesSpawned++;
      } else break;
    }
  }

  function spawnEnemy(spec) {
    const margin = 40;
    const x = margin + Math.random() * (W - 2 * margin);
    state.enemies.push({
      id: state.nextEnemyId++,
      x: x, y: -30,
      value: spec.value,
      originalValue: spec.value,
      speed: spec.speed * 60, // px per second-ish (rows are ~60px)
      mascot: mascotFor(spec.value),
      flashTime: 0,
      dying: false,
      deathT: 0,
    });
  }

  // ============ PARTICLES ============
  function spawnConfetti(x, y) {
    const colors = ['#ff6b6b','#ffd166','#43d177','#6c8dff','#9d4edd','#ff8e3c'];
    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      state.particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        life: 1,
        decay: 0.015 + Math.random() * 0.015,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 3 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.3,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += 0.15 * dt * 60;
      p.life -= p.decay * dt * 60;
      p.rot += p.vrot;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const f = state.floatingTexts[i];
      f.y += f.vy;
      f.life -= 0.02;
      if (f.life <= 0) state.floatingTexts.splice(i, 1);
    }
  }

  // ============ DRAW ============
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    // Linha de defesa
    const lineY = H - 50;
    ctx.strokeStyle = 'rgba(255, 100, 100, 0.4)';
    ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(10, lineY);
    ctx.lineTo(W - 10, lineY);
    ctx.stroke();
    ctx.setLineDash([]);
    // Castelinho/coração na linha
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏰', W / 2, lineY + 22);

    // Inimigos
    for (const e of state.enemies) {
      drawEnemy(e);
    }

    // Partículas
    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
      ctx.restore();
    }

    // Floating texts
    for (const f of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.font = "800 22px 'Baloo 2', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillStyle = f.color;
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 4;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawEnemy(e) {
    const radius = 30 + Math.min(8, Math.log2(Math.abs(e.value) + 1) * 2);
    const flash = e.flashTime > 0 ? Math.sin(e.flashTime * 30) * 0.5 + 0.5 : 0;

    if (e.dying) {
      // Animação de morte
      const t = e.deathT;
      const scale = 1 + t * 0.5;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.translate(e.x, e.y);
      ctx.scale(scale, scale);
      drawEnemyBody(0, 0, radius, e.value, e.mascot, flash);
      ctx.restore();
      return;
    }

    drawEnemyBody(e.x, e.y, radius, e.value, e.mascot, flash);
  }

  function drawEnemyBody(x, y, radius, value, mascot, flash) {
    const color = colorFor(value);
    // Corpo (círculo com borda)
    ctx.save();
    ctx.translate(x, y);
    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(0, radius + 6, radius * 0.6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Corpo
    ctx.fillStyle = color;
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    // Highlight superior
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.ellipse(-radius * 0.3, -radius * 0.4, radius * 0.4, radius * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    // Borda branca
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();
    // Flash
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`;
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    // Número
    ctx.fillStyle = 'white';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 3;
    const fontSize = String(value).length > 2 ? radius * 0.8 : radius * 1.0;
    ctx.font = `800 ${fontSize}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(String(value), 0, 2);
    ctx.fillText(String(value), 0, 2);
    ctx.restore();
  }

  // ============ MAIN LOOP ============
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    if (state.gameRunning) {
      const elapsed = (now - state.levelStartTime) / 1000;
      maybeSpawnEnemies(elapsed);

      // Atualizar inimigos
      for (let i = state.enemies.length - 1; i >= 0; i--) {
        const e = state.enemies[i];
        if (e.flashTime > 0) e.flashTime -= dt;
        if (e.dying) {
          e.deathT += dt * 2.5;
          if (e.deathT >= 1) state.enemies.splice(i, 1);
          continue;
        }
        e.y += e.speed * dt;
        const lineY = H - 50;
        if (e.y >= lineY) {
          // Inimigo passou - perde vida
          state.enemies.splice(i, 1);
          state.lives--;
          updateHUD();
          state.shake = 14;
          if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
          flashMsg('OPA!', '#e63946');
          if (state.lives <= 0) {
            loseLevel();
            break;
          }
        }
      }

      updateParticles(dt);
      if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 30);

      // Vitória? Todos spawnados e nenhum vivo
      if (
        state.gameRunning &&
        state.enemiesSpawned >= state.currentLevel.enemies.length &&
        state.enemies.length === 0
      ) {
        winLevel();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ============ FLASH MSG ============
  function flashMsg(text, color = '#ff6b6b') {
    const el = document.getElementById('flashMsg');
    el.textContent = text;
    el.style.color = color;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  // ============ WIN / LOSE ============
  function winLevel() {
    state.gameRunning = false;
    flashMsg('VITÓRIA!', '#43d177');
    setTimeout(() => {
      const stars = computeStars();
      const lvl = state.currentLevel;
      const prev = state.progress[lvl.id] || { stars: 0, score: 0 };
      state.progress[lvl.id] = {
        stars: Math.max(prev.stars, stars),
        score: Math.max(prev.score, state.score),
      };
      saveProgress();
      document.getElementById('winSub').textContent = lvl.title;
      document.getElementById('winStars').innerHTML = renderStarsHtml(stars);
      document.getElementById('winScore').textContent = state.score;
      document.getElementById('winLives').textContent = state.lives;
      document.getElementById('gameHud').style.display = 'none';
      document.getElementById('wrap').style.display = 'none';
      document.getElementById('hand').style.display = 'none';
      document.getElementById('winScreen').classList.add('show');
    }, 1200);
  }

  function computeStars() {
    const lvl = state.currentLevel;
    const livesPct = state.lives / lvl.lives;
    if (livesPct >= 1) return 3;
    if (livesPct >= 0.5) return 2;
    return 1;
  }

  function loseLevel() {
    state.gameRunning = false;
    state.lossOfLevel = true;
    flashMsg('💔', '#e63946');
    setTimeout(() => {
      document.getElementById('gameHud').style.display = 'none';
      document.getElementById('wrap').style.display = 'none';
      document.getElementById('hand').style.display = 'none';
      document.getElementById('loseScreen').classList.add('show');
    }, 1000);
  }

  // ============ NAVIGATION ============
  document.getElementById('backBtn').onclick = () => {
    state.gameRunning = false;
    document.getElementById('gameHud').style.display = 'none';
    document.getElementById('wrap').style.display = 'none';
    document.getElementById('hand').style.display = 'none';
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
    renderMenu();
    document.getElementById('menuScreen').classList.add('show');
  };

  document.getElementById('winNextBtn').onclick = () => {
    const idx = LEVELS.findIndex(l => l.id === state.currentLevel.id);
    if (idx < LEVELS.length - 1) {
      document.getElementById('winScreen').classList.remove('show');
      startLevel(LEVELS[idx + 1]);
    } else {
      document.getElementById('winScreen').classList.remove('show');
      renderMenu();
      document.getElementById('menuScreen').classList.add('show');
    }
  };
  document.getElementById('winMenuBtn').onclick = () => {
    document.getElementById('winScreen').classList.remove('show');
    renderMenu();
    document.getElementById('menuScreen').classList.add('show');
  };
  document.getElementById('winDoubleBtn').onclick = () => {
    state.score *= 2;
    document.getElementById('winScore').textContent = state.score;
    const lvl = state.currentLevel;
    state.progress[lvl.id].score = Math.max(state.progress[lvl.id].score, state.score);
    saveProgress();
    flashMsg('×2!', '#43d177');
  };

  document.getElementById('loseRetryBtn').onclick = () => {
    document.getElementById('loseScreen').classList.remove('show');
    startLevel(state.currentLevel);
  };
  document.getElementById('loseMenuBtn').onclick = () => {
    document.getElementById('loseScreen').classList.remove('show');
    renderMenu();
    document.getElementById('menuScreen').classList.add('show');
  };
  document.getElementById('loseReviveBtn').onclick = () => {
    document.getElementById('loseScreen').classList.remove('show');
    state.lives = 2;
    state.gameRunning = true;
    document.getElementById('gameHud').style.display = 'flex';
    document.getElementById('wrap').style.display = 'flex';
    document.getElementById('hand').style.display = 'flex';
    updateHUD();
  };

  // ============ INIT ============
  renderMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
