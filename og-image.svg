<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="50%" stop-color="#ffd6e8"/>
      <stop offset="100%" stop-color="#d6e8ff"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#6c8dff"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo Numinhos GIGANTE no centro — destaque máximo -->
  <text x="600" y="290"
        font-family="'Baloo 2', 'Fredoka', 'Comic Sans MS', sans-serif"
        font-weight="900" font-size="200"
        text-anchor="middle"
        fill="url(#logoGrad)"
        letter-spacing="-6"
        filter="url(#softShadow)">Numinhos</text>

  <!-- Tagline -->
  <text x="600" y="360"
        font-family="'Fredoka', 'Helvetica', sans-serif"
        font-weight="500" font-size="36"
        text-anchor="middle"
        fill="#2d1f3d" opacity="0.7">pequenos números, grandes aventuras</text>

  <!-- 4 Mentores em fila menor, embaixo (suporte ao logo) -->
  <g transform="translate(370, 430)">
    <circle cx="55" cy="55" r="55" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(0, 0) scale(1.1)">
      <ellipse cx="50" cy="55" rx="36" ry="30" fill="#a67c52"/>
      <ellipse cx="50" cy="55" rx="36" ry="30" fill="none" stroke="#7a5a3a" stroke-width="2"/>
      <ellipse cx="50" cy="67" rx="13" ry="9" fill="#c9a17e"/>
      <circle cx="38" cy="46" r="4" fill="white"/>
      <circle cx="62" cy="46" r="4" fill="white"/>
      <circle cx="38" cy="47" r="2.2" fill="#2d1f3d"/>
      <circle cx="62" cy="47" r="2.2" fill="#2d1f3d"/>
      <ellipse cx="33" cy="30" rx="5" ry="6" fill="#a67c52" stroke="#7a5a3a" stroke-width="1.5"/>
      <ellipse cx="67" cy="30" rx="5" ry="6" fill="#a67c52" stroke="#7a5a3a" stroke-width="1.5"/>
    </g>
  </g>

  <g transform="translate(510, 430)">
    <circle cx="55" cy="55" r="55" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(0, 0) scale(1.1)">
      <ellipse cx="50" cy="55" rx="30" ry="32" fill="#1a1a2e"/>
      <ellipse cx="50" cy="63" rx="20" ry="16" fill="#ffd166"/>
      <path d="M 55 42 Q 90 36 86 52 Q 70 52 55 52 Z" fill="#ff8e3c" stroke="#c95a1a" stroke-width="1.5"/>
      <path d="M 55 42 Q 76 39 78 45" stroke="#43d177" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="42" r="5" fill="white"/>
      <circle cx="42" cy="43" r="2.8" fill="#2d1f3d"/>
    </g>
  </g>

  <g transform="translate(650, 430)">
    <circle cx="55" cy="55" r="55" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(0, 0) scale(1.1)">
      <path d="M 15 52 Q 30 28 60 33 Q 86 40 83 57 Q 78 72 60 69 Q 30 75 15 52 Z" fill="#ff9eb5" stroke="#d6739e" stroke-width="2"/>
      <ellipse cx="22" cy="55" rx="9" ry="5" fill="#ff9eb5" stroke="#d6739e" stroke-width="1.5"/>
      <circle cx="38" cy="48" r="3.5" fill="white"/>
      <circle cx="38" cy="49" r="1.8" fill="#2d1f3d"/>
      <path d="M 55 28 L 60 16 L 65 30 Z" fill="#ff9eb5" stroke="#d6739e" stroke-width="1.5"/>
      <path d="M 22 58 Q 28 61 33 58" stroke="#2d1f3d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(790, 430)">
    <circle cx="55" cy="55" r="55" fill="white" filter="url(#softShadow)"/>
    <g transform="translate(0, 0) scale(1.1)">
      <ellipse cx="50" cy="55" rx="34" ry="30" fill="#f5c14b"/>
      <ellipse cx="50" cy="55" rx="34" ry="30" fill="none" stroke="#c8941a" stroke-width="2"/>
      <ellipse cx="35" cy="51" rx="2.8" ry="2.3" fill="#2d1f3d" opacity="0.6"/>
      <ellipse cx="65" cy="51" rx="2.8" ry="2.3" fill="#2d1f3d" opacity="0.6"/>
      <ellipse cx="50" cy="73" rx="2.3" ry="1.8" fill="#2d1f3d" opacity="0.6"/>
      <path d="M 26 35 L 22 20 L 36 30 Z" fill="#f5c14b" stroke="#c8941a" stroke-width="1.5"/>
      <path d="M 74 35 L 78 20 L 64 30 Z" fill="#f5c14b" stroke="#c8941a" stroke-width="1.5"/>
      <ellipse cx="38" cy="44" rx="5" ry="6" fill="white"/>
      <ellipse cx="62" cy="44" rx="5" ry="6" fill="white"/>
      <ellipse cx="38" cy="45" rx="2" ry="4" fill="#43d177"/>
      <ellipse cx="62" cy="45" rx="2" ry="4" fill="#43d177"/>
      <ellipse cx="50" cy="60" rx="5" ry="3.5" fill="#ffd6a8"/>
    </g>
  </g>

  <!-- URL final -->
  <text x="600" y="595"
        font-family="'Baloo 2', sans-serif"
        font-weight="700" font-size="26"
        text-anchor="middle"
        fill="#2d1f3d" opacity="0.55">numinhos.app</text>
</svg>
