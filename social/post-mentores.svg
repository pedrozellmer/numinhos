<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="50%" stop-color="#ffd6e8"/>
      <stop offset="100%" stop-color="#d6e8ff"/>
    </linearGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <text x="540" y="115" font-family="sans-serif" font-weight="900" font-size="64"
        text-anchor="middle" fill="#2d1f3d">Conheça os Mentores</text>
  <text x="540" y="165" font-family="sans-serif" font-weight="600" font-size="30"
        text-anchor="middle" fill="#2d1f3d" opacity="0.6">cada operação tem um amigo brasileiro</text>

  <!-- CAPI: círculo r=100, mascote centrado, nome em y=320 -->
  <g transform="translate(140, 215)">
    <circle cx="100" cy="100" r="100" fill="#fff" filter="url(#sh)"/>
    <g transform="translate(35, 35) scale(1.3)">
      <ellipse cx="50" cy="60" rx="38" ry="32" fill="#a67c52"/>
      <ellipse cx="50" cy="60" rx="38" ry="32" fill="none" stroke="#7a5a3a" stroke-width="2"/>
      <ellipse cx="50" cy="72" rx="14" ry="10" fill="#c9a17e"/>
      <circle cx="38" cy="50" r="4.5" fill="#fff"/><circle cx="62" cy="50" r="4.5" fill="#fff"/>
      <circle cx="38" cy="51" r="2.5" fill="#2d1f3d"/><circle cx="62" cy="51" r="2.5" fill="#2d1f3d"/>
      <ellipse cx="32" cy="33" rx="5" ry="6" fill="#a67c52" stroke="#7a5a3a" stroke-width="1.5"/>
      <ellipse cx="68" cy="33" rx="5" ry="6" fill="#a67c52" stroke="#7a5a3a" stroke-width="1.5"/>
      <path d="M 44 80 Q 50 84 56 80" stroke="#2d1f3d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="100" y="262" font-family="sans-serif" font-weight="900" font-size="44" text-anchor="middle" fill="#2aa85b">+ Capi</text>
    <text x="100" y="300" font-family="sans-serif" font-weight="600" font-size="25" text-anchor="middle" fill="#2d1f3d" opacity="0.6">Capivara · Pantanal</text>
  </g>

  <!-- TUCA -->
  <g transform="translate(580, 215)">
    <circle cx="100" cy="100" r="100" fill="#fff" filter="url(#sh)"/>
    <g transform="translate(35, 35) scale(1.3)">
      <ellipse cx="50" cy="60" rx="32" ry="34" fill="#1a1a2e"/>
      <ellipse cx="50" cy="68" rx="22" ry="18" fill="#ffd166"/>
      <path d="M 55 45 Q 92 38 88 55 Q 70 55 55 55 Z" fill="#ff8e3c" stroke="#c95a1a" stroke-width="1.5"/>
      <path d="M 55 45 Q 78 42 80 48" stroke="#43d177" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="42" cy="44" r="6" fill="#fff"/><circle cx="42" cy="45" r="3" fill="#2d1f3d"/>
    </g>
    <text x="100" y="262" font-family="sans-serif" font-weight="900" font-size="44" text-anchor="middle" fill="#c92a2a">&#8722; Tuca</text>
    <text x="100" y="300" font-family="sans-serif" font-weight="600" font-size="25" text-anchor="middle" fill="#2d1f3d" opacity="0.6">Tucano · Amazônia</text>
  </g>

  <!-- BOTO -->
  <g transform="translate(140, 575)">
    <circle cx="100" cy="100" r="100" fill="#fff" filter="url(#sh)"/>
    <g transform="translate(35, 40) scale(1.3)">
      <path d="M 15 55 Q 30 30 60 35 Q 88 42 85 60 Q 80 75 60 72 Q 30 78 15 55 Z" fill="#ff9eb5" stroke="#d6739e" stroke-width="2"/>
      <ellipse cx="22" cy="58" rx="10" ry="5" fill="#ff9eb5" stroke="#d6739e" stroke-width="1.5"/>
      <circle cx="38" cy="52" r="3.5" fill="#fff"/><circle cx="38" cy="53" r="2" fill="#2d1f3d"/>
      <path d="M 55 30 L 60 18 L 65 32 Z" fill="#ff9eb5" stroke="#d6739e" stroke-width="1.5"/>
      <path d="M 22 62 Q 28 65 33 62" stroke="#2d1f3d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <text x="100" y="262" font-family="sans-serif" font-weight="900" font-size="44" text-anchor="middle" fill="#b58200">&#215; Boto</text>
    <text x="100" y="300" font-family="sans-serif" font-weight="600" font-size="23" text-anchor="middle" fill="#2d1f3d" opacity="0.6">Boto-cor-de-rosa · Amazonas</text>
  </g>

  <!-- MIRA -->
  <g transform="translate(580, 575)">
    <circle cx="100" cy="100" r="100" fill="#fff" filter="url(#sh)"/>
    <g transform="translate(35, 35) scale(1.3)">
      <ellipse cx="50" cy="60" rx="36" ry="32" fill="#f5c14b"/>
      <ellipse cx="50" cy="60" rx="36" ry="32" fill="none" stroke="#c8941a" stroke-width="2"/>
      <ellipse cx="35" cy="55" rx="3" ry="2.5" fill="#2d1f3d" opacity="0.6"/>
      <ellipse cx="65" cy="55" rx="3" ry="2.5" fill="#2d1f3d" opacity="0.6"/>
      <ellipse cx="50" cy="78" rx="2.5" ry="2" fill="#2d1f3d" opacity="0.6"/>
      <path d="M 26 38 L 22 22 L 36 32 Z" fill="#f5c14b" stroke="#c8941a" stroke-width="1.5"/>
      <path d="M 74 38 L 78 22 L 64 32 Z" fill="#f5c14b" stroke="#c8941a" stroke-width="1.5"/>
      <ellipse cx="38" cy="48" rx="5" ry="6" fill="#fff"/><ellipse cx="62" cy="48" rx="5" ry="6" fill="#fff"/>
      <ellipse cx="38" cy="49" rx="2" ry="4" fill="#43d177"/><ellipse cx="62" cy="49" rx="2" ry="4" fill="#43d177"/>
      <ellipse cx="50" cy="64" rx="6" ry="4" fill="#ffd6a8"/>
    </g>
    <text x="100" y="262" font-family="sans-serif" font-weight="900" font-size="44" text-anchor="middle" fill="#2d4dc7">&#247; Mira</text>
    <text x="100" y="300" font-family="sans-serif" font-weight="600" font-size="25" text-anchor="middle" fill="#2d1f3d" opacity="0.6">Onça-Pintada · Cerrado</text>
  </g>

  <text x="540" y="1035" font-family="sans-serif" font-weight="800" font-size="34"
        text-anchor="middle" fill="#2d1f3d" opacity="0.7">numinhos.app</text>
</svg>
