<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="50%" stop-color="#ffd6e8"/>
      <stop offset="100%" stop-color="#d6e8ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#6c8dff"/>
    </linearGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Logo -->
  <text x="540" y="240" font-family="sans-serif" font-weight="900" font-size="150"
        text-anchor="middle" fill="url(#logo)" letter-spacing="-4" filter="url(#sh)">Numinhos</text>

  <!-- Tagline -->
  <text x="540" y="320" font-family="sans-serif" font-weight="600" font-size="42"
        text-anchor="middle" fill="#2d1f3d" opacity="0.7">matemática vira aventura</text>

  <!-- 4 Numinhos com olhinhos -->
  <g transform="translate(180, 430)">
    <circle cx="90" cy="90" r="90" fill="#43d177"/>
    <circle cx="90" cy="90" r="90" fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="68" cy="72" r="13" fill="#fff"/><circle cx="112" cy="72" r="13" fill="#fff"/>
    <circle cx="70" cy="74" r="7" fill="#2d1f3d"/><circle cx="114" cy="74" r="7" fill="#2d1f3d"/>
    <text x="90" y="135" font-family="sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#fff">3</text>
  </g>
  <g transform="translate(400, 430)">
    <circle cx="90" cy="90" r="90" fill="#ffd166"/>
    <circle cx="90" cy="90" r="90" fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="68" cy="72" r="13" fill="#fff"/><circle cx="112" cy="72" r="13" fill="#fff"/>
    <circle cx="70" cy="74" r="7" fill="#2d1f3d"/><circle cx="114" cy="74" r="7" fill="#2d1f3d"/>
    <text x="90" y="135" font-family="sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#fff">7</text>
  </g>
  <g transform="translate(620, 430)">
    <circle cx="90" cy="90" r="90" fill="#ff8e3c"/>
    <circle cx="90" cy="90" r="90" fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="68" cy="72" r="13" fill="#fff"/><circle cx="112" cy="72" r="13" fill="#fff"/>
    <circle cx="70" cy="74" r="7" fill="#2d1f3d"/><circle cx="114" cy="74" r="7" fill="#2d1f3d"/>
    <text x="90" y="135" font-family="sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#fff">12</text>
  </g>
  <g transform="translate(840, 430)">
    <circle cx="90" cy="90" r="90" fill="#6c8dff"/>
    <circle cx="90" cy="90" r="90" fill="none" stroke="#fff" stroke-width="6"/>
    <circle cx="68" cy="72" r="13" fill="#fff"/><circle cx="112" cy="72" r="13" fill="#fff"/>
    <circle cx="70" cy="74" r="7" fill="#2d1f3d"/><circle cx="114" cy="74" r="7" fill="#2d1f3d"/>
    <text x="90" y="135" font-family="sans-serif" font-weight="900" font-size="58" text-anchor="middle" fill="#fff">9</text>
  </g>

  <!-- Operações -->
  <text x="540" y="730" font-family="sans-serif" font-weight="800" font-size="56"
        text-anchor="middle" fill="#2d1f3d">+ &#8722; &#215; &#247;</text>
  <text x="540" y="790" font-family="sans-serif" font-weight="600" font-size="34"
        text-anchor="middle" fill="#2d1f3d" opacity="0.6">some, subtraia, multiplique e divida</text>

  <!-- CTA -->
  <rect x="290" y="860" width="500" height="110" rx="55" fill="#2d1f3d"/>
  <text x="540" y="930" font-family="sans-serif" font-weight="800" font-size="48"
        text-anchor="middle" fill="#fff">numinhos.app</text>
  <text x="540" y="1020" font-family="sans-serif" font-weight="700" font-size="32"
        text-anchor="middle" fill="#2d1f3d" opacity="0.65">jogue grátis no PC ou celular</text>
</svg>
