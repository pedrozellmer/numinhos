<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8d6"/>
      <stop offset="50%" stop-color="#ffd6e8"/>
      <stop offset="100%" stop-color="#d6e8ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#6c8dff"/>
    </linearGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="12" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Logo -->
  <text x="540" y="420" font-family="sans-serif" font-weight="900" font-size="170"
        text-anchor="middle" fill="url(#logo)" letter-spacing="-5" filter="url(#sh)">Numinhos</text>
  <text x="540" y="500" font-family="sans-serif" font-weight="600" font-size="44"
        text-anchor="middle" fill="#2d1f3d" opacity="0.7">matemática vira aventura</text>

  <!-- Numinhos descendo -->
  <g transform="translate(150, 640)">
    <circle cx="100" cy="100" r="100" fill="#43d177"/>
    <circle cx="100" cy="100" r="100" fill="none" stroke="#fff" stroke-width="7"/>
    <circle cx="74" cy="80" r="15" fill="#fff"/><circle cx="126" cy="80" r="15" fill="#fff"/>
    <circle cx="76" cy="82" r="8" fill="#2d1f3d"/><circle cx="128" cy="82" r="8" fill="#2d1f3d"/>
    <text x="100" y="150" font-family="sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#fff">4</text>
  </g>
  <g transform="translate(580, 720)">
    <circle cx="100" cy="100" r="100" fill="#ff8e3c"/>
    <circle cx="100" cy="100" r="100" fill="none" stroke="#fff" stroke-width="7"/>
    <circle cx="74" cy="80" r="15" fill="#fff"/><circle cx="126" cy="80" r="15" fill="#fff"/>
    <circle cx="76" cy="82" r="8" fill="#2d1f3d"/><circle cx="128" cy="82" r="8" fill="#2d1f3d"/>
    <text x="100" y="150" font-family="sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#fff">15</text>
  </g>
  <g transform="translate(320, 900)">
    <circle cx="100" cy="100" r="100" fill="#6c8dff"/>
    <circle cx="100" cy="100" r="100" fill="none" stroke="#fff" stroke-width="7"/>
    <circle cx="74" cy="80" r="15" fill="#fff"/><circle cx="126" cy="80" r="15" fill="#fff"/>
    <circle cx="76" cy="82" r="8" fill="#2d1f3d"/><circle cx="128" cy="82" r="8" fill="#2d1f3d"/>
    <text x="100" y="150" font-family="sans-serif" font-weight="900" font-size="64" text-anchor="middle" fill="#fff">8</text>
  </g>

  <!-- Bloco de texto -->
  <text x="540" y="1240" font-family="sans-serif" font-weight="800" font-size="52"
        text-anchor="middle" fill="#2d1f3d">+ &#8722; &#215; &#247;</text>
  <text x="540" y="1320" font-family="sans-serif" font-weight="700" font-size="40"
        text-anchor="middle" fill="#2d1f3d" opacity="0.7">5 modos · 40 fases</text>
  <text x="540" y="1380" font-family="sans-serif" font-weight="600" font-size="36"
        text-anchor="middle" fill="#2d1f3d" opacity="0.6">com Capi, Tuca, Boto e Mira</text>

  <!-- CTA grande -->
  <rect x="190" y="1500" width="700" height="160" rx="80" fill="#2d1f3d" filter="url(#sh)"/>
  <text x="540" y="1602" font-family="sans-serif" font-weight="900" font-size="64"
        text-anchor="middle" fill="#fff">numinhos.app</text>
  <text x="540" y="1740" font-family="sans-serif" font-weight="700" font-size="40"
        text-anchor="middle" fill="#2d1f3d" opacity="0.7">jogue grátis · sem anúncios</text>

  <!-- seta arrasta pra cima -->
  <text x="540" y="1850" font-family="sans-serif" font-weight="700" font-size="36"
        text-anchor="middle" fill="#2d1f3d" opacity="0.45">&#8593; link na bio</text>
</svg>
